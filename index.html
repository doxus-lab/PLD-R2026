    // ==========================================
    // ESTADO Y LÓGICA DE CONTROL
    // ==========================================
    let currentSlide = 0;
    const totalSlides = slidesData.length;
    let viewMode = 'slide'; // 'slide' o 'doc'

    function renderSlide(index) {
      if (index < 0 || index >= totalSlides) return;
      currentSlide = index;

      const data = slidesData[currentSlide];
      const contentEl = document.getElementById('slideContent');
      
      // Aplicar animación de cambio
      contentEl.classList.remove('slide-active');
      contentEl.classList.add('slide-enter');

      // Actualizar encabezados y medidores
      document.getElementById('slideTag').innerText = data.tag;
      document.getElementById('slideSubtitle').innerText = data.subtitle;
      document.getElementById('slideCounter').innerText = `${currentSlide + 1} / ${totalSlides}`;
      
      // Barra de progreso
      const progressPercent = ((currentSlide + 1) / totalSlides) * 100;
      document.getElementById('slideProgressBar').style.width = `${progressPercent}%`;

      // Render del cuerpo del slide
      setTimeout(() => {
        contentEl.innerHTML = `
          <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col justify-center">
            <div class="mb-5">
              <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight leading-snug">${data.title}</h2>
              <p class="text-xs sm:text-sm text-slate-400 mt-1">${data.subtitle}</p>
            </div>
            ${data.content}
          </div>
        `;
        contentEl.classList.remove('slide-enter');
        contentEl.classList.add('slide-active');
        
        // Inicializar calculadora si estamos en la lámina correspondiente
        if (currentSlide === 5) {
          runCalculator();
        }
      }, 50);

      // Estado de botones de navegación
      document.getElementById('prevBtn').disabled = (currentSlide === 0);
      document.getElementById('nextBtn').disabled = (currentSlide === totalSlides - 1);
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        goToSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        goToSlide(currentSlide - 1);
      }
    }

    function goToSlide(index) {
      if (viewMode !== 'slide') setViewMode('slide');
      renderSlide(index);
    }

    // ==========================================
    // CAMBIO ENTRE VISTA SLIDE Y VISTA DOCUMENTO
    // ==========================================
    function setViewMode(mode) {
      viewMode = mode;
      const slideViewport = document.getElementById('slideViewport');
      const docViewport = document.getElementById('docViewport');
      const slideFooter = document.getElementById('slideFooterControls');
      const slideBtn = document.getElementById('viewSlideBtn');
      const docBtn = document.getElementById('viewDocBtn');

      if (mode === 'slide') {
        slideViewport.classList.remove('hidden');
        docViewport.classList.add('hidden');

        slideBtn.className = "px-3 py-1.5 rounded-md font-medium flex items-center gap-1.5 bg-brand-800 text-white transition shadow-sm";
        docBtn.className = "px-3 py-1.5 rounded-md font-medium flex items-center gap-1.5 text-slate-400 hover:text-slate-200 transition";

        slideViewport.classList.add('hidden');

    // ==========================================
    // CALCULADORA DE UMBRALES INTERACTIVA
    // ==========================================
    function runCalculator() {
      const act = document.getElementById('calcActivity');
      const amtInput = document.getElementById('calcAmount');
      if (!act || !amtInput) return;

      const actVal = act.value;
      const amt = parseFloat(amtInput.value) || 0;
      const uma = 117.31; // Valor UMA base 2026

      let idAlways = false;
      let idThreshold = 0;
      let avisoThreshold = 0;

      switch(actVal) {
        case 'inmuebles':
          idAlways = true;
          avisoThreshold = 8025 * uma; // $941,412.75
          break;
        case 'vehiculos':
          idThreshold = 3210 * uma; // $376,565.10
          avisoThreshold = 6420 * uma; // $753,130.20
          break;
        case 'joyas':
          idThreshold = 805 * uma; // $94,434.55
          avisoThreshold = 1605 * uma; // $188,282.55
          break;
        case 'arrendamiento':
          idThreshold = 1605 * uma; // $188,282.55
          avisoThreshold = 3210 * uma; // $376,565.10
          break;
        case 'mutuo':
          idAlways = true;
          avisoThreshold = 1605 * uma; // $188,282.55
          break;
        case 'blindaje':
          idThreshold = 2410 * uma; // $282,717.10
          avisoThreshold = 4815 * uma; // $564,847.65
          break;
        case 'cripto':
          idAlways = true;
          avisoThreshold = 210 * uma; // $24,635.10
          break;
      }

      // Evaluar Identificación
      const resId = document.getElementById('resId');
      const resIdDetail = document.getElementById('resIdDetail');
      if (idAlways || amt >= idThreshold) {
        resId.innerText = "OBLIGATORIA";
        resId.className = "text-sm font-bold text-emerald-400 mt-1";
        resIdDetail.innerText = idAlways ? "Obligatoria sin importar el monto" : `Rebasó umbral ($${idThreshold.toLocaleString('es-MX', {maximumFractionDigits:2})})`;
      } else {
        resId.innerText = "EXENTA";
        resId.className = "text-sm font-bold text-slate-400 mt-1";
        resIdDetail.innerText = `Menor al umbral ($${idThreshold.toLocaleString('es-MX', {maximumFractionDigits:2})})`;
      }

      // Evaluar Aviso
      const resAviso = document.getElementById('resAviso');
      const resAvisoDetail = document.getElementById('resAvisoDetail');
      if (amt >= avisoThreshold) {
        resAviso.innerText = "¡AVISO OBLIGATORIO!";
        resAviso.className = "text-sm font-bold text-amber-400 mt-1";
        resAvisoDetail.innerText = `Rebasó umbral ($${avisoThreshold.toLocaleString('es-MX', {maximumFractionDigits:2})})`;
      } else {
        resAviso.innerText = "SIN AVISO";
        resAviso.className = "text-sm font-bold text-slate-400 mt-1";
        resAvisoDetail.innerText = `Umbral de aviso: $${avisoThreshold.toLocaleString('es-MX', {maximumFractionDigits:2})}`;
      }
    }

    // ==========================================
    // BUSCADOR MODAL Y ATAJOS
    // ==========================================
    function toggleModal(modalId) {
      const m = document.getElementById(modalId);
      const isHidden = m.classList.contains('hidden');
      if (isHidden) {
        m.classList.remove('hidden');
        renderSearchList(slidesData);
        setTimeout(() => document.getElementById('searchInput').focus(), 100);
      } else {
        m.classList.add('hidden');
      }
    }

    function renderSearchList(list) {
      const container = document.getElementById('searchResults');
      if (list.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No se encontraron temas coincidentes.</div>`;
        return;
      }
      container.innerHTML = list.map(item => {
        const originalIndex = slidesData.indexOf(item);
        return `
          <button onclick="goToSlide(${originalIndex}); toggleModal('searchModal');" class="w-full text-left p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 flex items-center justify-between transition group">
            <div>
              <div class="text-[11px] font-bold text-brand-gold uppercase tracking-wider">${item.tag}</div>
              <div class="text-sm font-semibold text-white group-hover:text-brand-gold transition">${item.title}</div>
              <div class="text-xs text-slate-400 mt-0.5 line-clamp-1">${item.subtitle}</div>
            </div>
            <i class="ph-bold ph-caret-right text-slate-500 group-hover:text-white transition"></i>
          </button>
        `;
      }).join('');
    }

    function filterSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderSearchList(slidesData);
        return;
      }
      const filtered = slidesData.filter(s => 
        s.title.toLowerCase().includes(query) ||
        s.subtitle.toLowerCase().includes(query) ||
        s.tag.toLowerCase().includes(query) ||
        s.content.toLowerCase().includes(query)
      );
      renderSearchList(filtered);
    }

    // Pantalla completa
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('fsIcon').className = "ph-bold ph-arrows-in text-lg";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          document.getElementById('fsIcon').className = "ph-bold ph-arrows-out text-lg";
        }
      }
    }

    // Navegación por teclado
    window.addEventListener('keydown', (e) => {
      // Ignorar si está escribiendo en el input de búsqueda o calculadora
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if (e.key === 'Escape') {
          toggleModal('searchModal');
        }
        return;
      }

      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === '/' || e.key === 'k' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        toggleModal('searchModal');
      } else if (e.key === 'Escape') {
        const sm = document.getElementById('searchModal');
        if (!sm.classList.contains('hidden')) toggleModal('searchModal');
      } else if (e.key === 'Home') {
        goToSlide(0);
      } else if (e.key === 'End') {
        goToSlide(totalSlides - 1);
      }
    });

    // Soporte táctil de deslizamiento (Swipe) en móvil
    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      if (viewMode !== 'slide') return;
      const swipeThreshold = 50;
      if (touchEndX < touchStartX - swipeThreshold) {
        nextSlide(); // Deslizar a la izquierda -> Siguiente
      }
      if (touchEndX > touchStartX + swipeThreshold) {
        prevSlide(); // Deslizar a la derecha -> Anterior
      }
    }

    // Inicialización al cargar la ventana
    window.onload = function() {
      renderSlide(0);
    };
  </script>
</body>
</html>
